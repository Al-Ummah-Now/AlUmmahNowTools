name: Suggestions check
# The boxes that suggest while one types (channels), in the real app on Windows and macOS with the system's own keyboard.
# The app runs in its demo mode: nothing is sent to any server.
on:
  pull_request:
    paths:
      - .github/workflows/suggest-check.yml
      - scripts/suggest-check.mjs
      - AlUmmahNow.VisualImporterUno/AlUmmahNow.VisualImporterUno/Shell/**
      - AlUmmahNow.VisualImporterUno/AlUmmahNow.VisualImporterUno/Helpers/AutoSuggest.cs
      - AlUmmahNow.VisualImporterUno/AlUmmahNow.VisualImporterUno/Views/ImportView*
      - AlUmmahNow.VisualImporterUno/AlUmmahNow.VisualImporterUno/Views/SocialSourcesPage*
      - AlUmmahNow.VisualImporterUno/AlUmmahNow.VisualImporterUno/Views/WatchManagementPage*
      - AlUmmahNow.VisualImporterUno/AlUmmahNow.VisualImporterUno/Views/ApprovalWorkflowPage*
      - AlUmmahNow.VisualImporterUno/AlUmmahNow.VisualImporterUno/ViewModels/ChannelSearch.cs
      - AlUmmahNow.VisualImporterUno/AlUmmahNow.VisualImporterUno/ViewModels/BulkImportViewModel.cs
      - AlUmmahNow.VisualImporterUno/AlUmmahNow.VisualImporterUno/ViewModels/SocialSourcesViewModel.cs
      - AlUmmahNow.VisualImporterUno/AlUmmahNow.VisualImporterUno/ViewModels/WatchViewModel.cs
      - AlUmmahNow.VisualImporterUno/AlUmmahNow.VisualImporterUno/ViewModels/ApprovalViewModel.cs
      - AlUmmahNow.VisualImporterUno/Directory.Packages.props
      - AlUmmahNow.VisualImporterUno/global.json
      - global.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: suggest-check-${{ github.ref }}
  cancel-in-progress: true
env:
  APP: AlUmmahNow.VisualImporterUno/AlUmmahNow.VisualImporterUno/AlUmmahNow.VisualImporterUno.csproj
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
jobs:
  suggestions:
    name: Suggestions on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 9.0.x
      - run: scripts/fetch-core.sh
      - name: Build the app
        run: dotnet build "$APP" -f net9.0-desktop -c Release
      - name: Type in every box that suggests
        run: |
          exe="$PWD/AlUmmahNow.VisualImporterUno/AlUmmahNow.VisualImporterUno/bin/Release/net9.0-desktop/AlUmmahNow.VisualImporterUno"
          [ "$RUNNER_OS" = Windows ] && exe="$(cygpath -w "$exe.exe")"
          failed=0
          for page in Import SocialSources WatchManagement ApprovalWorkflow; do
            node scripts/suggest-check.mjs "$exe" $page pictures || failed=1
          done
          # Right to left, the lists are placed by the app
          for page in Import SocialSources WatchManagement ApprovalWorkflow; do
            CHECK_LANG=ar node scripts/suggest-check.mjs "$exe" $page pictures/ar || failed=1
          done
          exit $failed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: suggestions-${{ matrix.os }}
          path: pictures
          retention-days: 14
          if-no-files-found: ignore
